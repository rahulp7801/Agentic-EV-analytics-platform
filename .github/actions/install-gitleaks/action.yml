name: Install secret scanner
description: Install the checksum-pinned Gitleaks binary on Linux runners
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          --output "$RUNNER_TEMP/gitleaks.tar.gz"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/secret-scanner"
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/secret-scanner" gitleaks
        echo "$RUNNER_TEMP/secret-scanner" >> "$GITHUB_PATH"

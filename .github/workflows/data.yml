name: Live paid market data
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [daily, monitor, public_daily, public_monitor, scan, watch, refresh, backfill]
        default: daily
      sport:
        type: choice
        options: [both, all, nfl, nba, cfb]
        default: both
      provider:
        description: 'Provider for watch only; leave all for other operations'
        type: choice
        options: [all, sportsbook, kalshi, prizepicks]
        default: all
      event_ids:
        description: 'Optional comma-separated exact provider event IDs for a targeted scan'
        type: string
        default: ''
  schedule:
    - cron: '17 13 * * *'
    - cron: '7,37 * * * *'
    # Free NFL history/NGS recovery after nflverse's documented 07:00 UTC poll.
    - cron: '29 10,22 * * *'
permissions:
  contents: read
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  update:
    # Enable only after database migration/backfill and provider-budget verification.
    if: >-
      github.ref == 'refs/heads/master' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.schedule == '17 13 * * *' && vars.DATA_PIPELINE_ENABLED == 'true') ||
        github.event.schedule == '29 10,22 * * *' ||
        (github.event.schedule == '7,37 * * * *' && (
          vars.DATA_PIPELINE_ENABLED == 'true' || vars.PAID_MONITOR_ENABLED == 'true'
        ))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SPORT: ${{ inputs.sport || (github.event.schedule == '29 10,22 * * *' && 'nfl' || (github.event.schedule == '17 13 * * *' || vars.DATA_PIPELINE_ENABLED == 'true') && 'all' || 'both') }}
      # The daily run refreshes history and settlements. Half-hour runs use the
      # quota-aware prop scanner when recommendations are enabled; otherwise
      # they retain the lower-cost provider monitor.
      OPERATION: ${{ inputs.operation || (github.event.schedule == '17 13 * * *' && 'daily' || github.event.schedule == '29 10,22 * * *' && 'refresh' || (vars.DATA_PIPELINE_ENABLED == 'true' && 'scan' || 'monitor')) }}
      PROVIDER: ${{ inputs.provider || 'all' }}
      EVENT_IDS: ${{ inputs.event_ids || '' }}
      DAILY_CREDIT_LIMIT: ${{ vars.ODDS_DAILY_CREDIT_LIMIT || '20' }}
      ODDS_ROLLING_CREDIT_LIMIT: ${{ vars.ODDS_ROLLING_CREDIT_LIMIT || '450' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install uv==0.11.32
      - run: uv sync --locked
      - name: Check worker configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
          ODDS_API_KEY: ${{ (env.OPERATION == 'daily' || env.OPERATION == 'monitor' || env.OPERATION == 'scan' || (env.OPERATION == 'watch' && (env.PROVIDER == 'all' || env.PROVIDER == 'sportsbook'))) && secrets.ODDS_API_KEY || '' }}
        run: |
          test -n "$DATABASE_URL" && test -n "$DATABASE_URL_ASYNC" || {
            echo 'Configure the database repository secrets before running market updates.'
            exit 1
          }
          if [ "$PROVIDER" != all ] && [ "$OPERATION" != watch ]; then
            echo 'Provider selection is supported only for watch operations.'
            exit 1
          fi
          if [ -n "$EVENT_IDS" ] && { [ "$OPERATION" != scan ] || [ "$SPORT" = both ] || [ "$SPORT" = all ]; }; then
            echo 'Targeted events require a single-sport scan operation.'
            exit 1
          fi
          if [ "$SPORT" = cfb ] && [ "$OPERATION" != watch ] && [ "$OPERATION" != scan ] && [ "$OPERATION" != refresh ] && [ "$OPERATION" != backfill ] && [ "$OPERATION" != daily ] && [ "$OPERATION" != monitor ]; then
            echo 'CFB supports paid daily, monitor, scan, watch, and history refresh operations.'
            exit 1
          fi
          if [ "$SPORT" = all ] && [ "$OPERATION" != daily ] && [ "$OPERATION" != monitor ] && [ "$OPERATION" != scan ]; then
            echo 'All-sport collection supports paid daily, monitor, and scan operations.'
            exit 1
          fi
          if [ "$SPORT" = cfb ] && [ "$PROVIDER" != sportsbook ] && [ "$PROVIDER" != all ]; then
            echo 'CFB currently supports only a manual watch operation with the sportsbook provider.'
            exit 1
          fi
          case "$OPERATION:$PROVIDER" in
            daily:*|monitor:*|scan:*|watch:all|watch:sportsbook)
              test -n "$ODDS_API_KEY" || { echo 'Configure the odds repository secret for this operation.'; exit 1; } ;;
          esac
      - name: Verify hosted schema is at the application head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked alembic current --check-heads
      - name: Collect live market data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ (env.OPERATION == 'daily' || env.OPERATION == 'monitor' || env.OPERATION == 'scan' || (env.OPERATION == 'watch' && (env.PROVIDER == 'all' || env.PROVIDER == 'sportsbook'))) && secrets.ODDS_API_KEY || '' }}
        run: |
          set +e
          case "$OPERATION" in
            daily|monitor|public_daily|public_monitor) uv run --locked python -m sportsbet.daily --sport "$SPORT" --mode "$OPERATION" --daily-credit-limit "$DAILY_CREDIT_LIMIT" ;;
            scan)
              target=()
              if [ -n "$EVENT_IDS" ]; then
                IFS=',' read -ra ids <<< "$EVENT_IDS"
                for id in "${ids[@]}"; do target+=(--event-id "$id"); done
              fi
              uv run --locked python -m sportsbet.scan --sport "$SPORT" --daily-credit-limit "$DAILY_CREDIT_LIMIT" "${target[@]}" ;;
            watch) uv run --locked python -m sportsbet.market_watch --sport "$SPORT" --provider "$PROVIDER" --daily-credit-limit "$DAILY_CREDIT_LIMIT" --publish ;;
            refresh) uv run --locked python -m sportsbet.refresh --sport "$SPORT" ;;
            backfill) uv run --locked python -m sportsbet.refresh --sport "$SPORT" --backfill ;;
            *) exit 1 ;;
          esac
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo '::warning title=Live data coverage is degraded::The worker completed and published an honest degraded report. Inspect this step and the dashboard coverage endpoints for the unavailable provider, model, or market.'
            {
              echo '### Live data collection: degraded coverage'
              echo ''
              echo 'The worker completed and published its report, but one or more requested providers, models, or markets were incomplete. This is an operational coverage warning; CI tests and deployment are separate workflows.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"
      - name: Update source-backed player profiles
        if: env.SPORT != 'cfb' && (env.OPERATION == 'daily' || env.OPERATION == 'refresh' || env.OPERATION == 'backfill')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
        run: |
          profile_sport="$SPORT"
          if [ "$SPORT" = all ]; then profile_sport=both; fi
          uv run --locked python -m sportsbet.player_profiles --sport "$profile_sport"
      - name: Score prospective NFL market edge
        if: env.OPERATION == 'daily' && (env.SPORT == 'both' || env.SPORT == 'all' || env.SPORT == 'nfl')
        timeout-minutes: 10
        env:
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/edge-checkpoint"
          uv run --locked python -m sportsbet.quant.priced_market_audit \
            --sport nfl --model-version empirical-jeffreys-v4 \
            --captured-after 2026-09-23T00:34:15+00:00 \
            > "$RUNNER_TEMP/edge-checkpoint/all-forecasts.json"
          uv run --locked python -m sportsbet.quant.priced_market_audit \
            --sport nfl --model-version empirical-jeffreys-v4 \
            --recommendations-only \
            --captured-after 2026-09-23T00:34:15+00:00 \
            > "$RUNNER_TEMP/edge-checkpoint/recommendations.json"
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          from sportsbet.quant.edge_evidence import assess_prospective_edge
          root = Path(os.environ['RUNNER_TEMP']) / 'edge-checkpoint'
          reports = {}
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf8') as summary:
              summary.write('### Prospective NFL prop edge checkpoint\n\n')
              summary.write('| Cohort | Earliest | Decided | Games | Market pairs | Model minus market Brier | Shadow prior-80 minus market Brier |\n')
              summary.write('| --- | ---: | ---: | ---: | ---: | ---: | ---: |\n')
              for label, filename in (('All forecasts', 'all-forecasts.json'),
                                      ('Recommendations', 'recommendations.json')):
                  reports[label] = json.loads((root / filename).read_text(encoding='utf8'))
                  result = reports[label]['prospective']
                  gap = result.get('paired_model_minus_market_brier')
                  gap_text = f'{gap:.5f}' if gap is not None else 'pending'
                  shadow_gap = result.get('paired_shadow_prior80_minus_market_brier')
                  shadow_text = f'{shadow_gap:.5f}' if shadow_gap is not None else 'pending'
                  summary.write(f'| {label} | {result["earliest_selections"]} | '
                                f'{result["decided"]} | {result.get("settled_games", 0)} | '
                                f'{result["paired_decided"]} | {gap_text} | {shadow_text} |\n')
              assessment = assess_prospective_edge(
                  reports['All forecasts'], reports['Recommendations'])
              (root / 'evidence-status.json').write_text(
                  json.dumps(assessment, indent=2, sort_keys=True), encoding='utf8')
              performance = reports['Recommendations']['prospective']['ledger_performance']
              roi = performance.get('roi')
              roi_text = f'{roi:.2%}' if roi is not None else 'pending'
              summary.write(f'\nEvidence status: `{assessment["status"]}`. '
                            f'Accepted-pick recorded-stake ROI: {roi_text}; '
                            f'CLV observations: {performance.get("clv_count", 0)}.\n')
          PY
      - name: Retain prospective NFL edge checkpoint
        if: always() && env.OPERATION == 'daily' && (env.SPORT == 'both' || env.SPORT == 'all' || env.SPORT == 'nfl')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nfl-edge-checkpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/edge-checkpoint/
          retention-days: 90
          if-no-files-found: warn
      - name: Stage public evidence without configured credentials
        if: always() && (env.OPERATION == 'watch' || env.OPERATION == 'daily' || env.OPERATION == 'monitor' || env.OPERATION == 'public_daily' || env.OPERATION == 'public_monitor' || env.OPERATION == 'refresh' || env.OPERATION == 'scan')
        id: evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ (env.OPERATION == 'daily' || env.OPERATION == 'monitor' || env.OPERATION == 'scan' || (env.OPERATION == 'watch' && (env.PROVIDER == 'all' || env.PROVIDER == 'sportsbook'))) && secrets.ODDS_API_KEY || '' }}
        run: uv run --locked python -m sportsbet.ingestion.public_artifacts --output "$RUNNER_TEMP/public-evidence"
      - name: Install checksum-pinned secret scanner
        if: always() && steps.evidence.outcome == 'success'
        id: scanner
        uses: ./.github/actions/install-gitleaks
      - name: Scan public evidence
        if: always() && steps.evidence.outcome == 'success' && steps.scanner.outcome == 'success'
        id: evidence_scan
        run: gitleaks dir "$RUNNER_TEMP/public-evidence" --config .gitleaks.toml --redact=100 --no-banner
      - name: Retain public market evidence for replay
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: market-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/public-evidence/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

name: Market data
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [daily, monitor, public_daily, public_monitor, scan, watch, refresh, backfill]
        default: daily
      sport:
        type: choice
        options: [both, nfl, nba]
        default: both
      provider:
        description: 'Provider for watch only; leave all for other operations'
        type: choice
        options: [all, sportsbook, kalshi, prizepicks]
        default: all
  schedule:
    - cron: '17 13 * * *'
    - cron: '7,37 * * * *'
    # Public-only recovery slots. GitHub may delay or drop scheduled events;
    # these give the 90-minute snapshot gate two more chances each hour without
    # doubling future paid-provider polling.
    - cron: '22,52 * * * *'
permissions:
  contents: read
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  update:
    # Enable only after database migration/backfill and provider-budget verification.
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || (vars.DATA_PIPELINE_ENABLED == 'true' && github.event.schedule != '22,52 * * * *') || vars.PUBLIC_DATA_PIPELINE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
      ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Public-only collection and stat refreshes do not receive the paid-provider key.
      ODDS_API_KEY: ${{ ((github.event_name == 'schedule' && vars.DATA_PIPELINE_ENABLED == 'true' && github.event.schedule != '22,52 * * * *') || inputs.operation == 'daily' || inputs.operation == 'monitor' || inputs.operation == 'scan' || (inputs.operation == 'watch' && (inputs.provider == 'all' || inputs.provider == 'sportsbook'))) && secrets.ODDS_API_KEY || '' }}
      SPORT: ${{ inputs.sport || 'both' }}
      # Full collection takes precedence if both scheduler flags are enabled.
      OPERATION: ${{ inputs.operation || (vars.DATA_PIPELINE_ENABLED == 'true' && github.event.schedule != '22,52 * * * *' && (github.event.schedule == '17 13 * * *' && 'daily' || 'monitor') || (github.event.schedule == '17 13 * * *' && 'public_daily' || 'public_monitor')) }}
      PROVIDER: ${{ inputs.provider || 'all' }}
      DAILY_CREDIT_LIMIT: ${{ vars.ODDS_DAILY_CREDIT_LIMIT || '25' }}
      ODDS_ROLLING_CREDIT_LIMIT: ${{ vars.ODDS_ROLLING_CREDIT_LIMIT || '450' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install uv==0.11.32
      - run: uv sync --locked
      - name: Check worker configuration
        run: |
          test -n "$DATABASE_URL" && test -n "$DATABASE_URL_ASYNC" || {
            echo 'Configure the database repository secrets before running market updates.'
            exit 1
          }
          if [ "$PROVIDER" != all ] && [ "$OPERATION" != watch ]; then
            echo 'Provider selection is supported only for watch operations.'
            exit 1
          fi
          case "$OPERATION:$PROVIDER" in
            daily:*|monitor:*|scan:*|watch:all|watch:sportsbook)
              test -n "$ODDS_API_KEY" || { echo 'Configure the odds repository secret for this operation.'; exit 1; } ;;
          esac
      - name: Verify hosted schema is at the application head
        run: uv run --locked alembic current --check-heads
      - name: Update market data
        run: |
          case "$OPERATION" in
            daily|monitor|public_daily|public_monitor) uv run --locked python -m sportsbet.daily --sport "$SPORT" --mode "$OPERATION" --daily-credit-limit "$DAILY_CREDIT_LIMIT" ;;
            scan) uv run --locked python -m sportsbet.scan --sport "$SPORT" --daily-credit-limit "$DAILY_CREDIT_LIMIT" ;;
            watch) uv run --locked python -m sportsbet.market_watch --sport "$SPORT" --provider "$PROVIDER" --daily-credit-limit "$DAILY_CREDIT_LIMIT" --publish ;;
            refresh) uv run --locked python -m sportsbet.refresh --sport "$SPORT" ;;
            backfill) uv run --locked python -m sportsbet.refresh --sport "$SPORT" --backfill ;;
            *) exit 1 ;;
          esac
      - name: Stage public evidence without configured credentials
        if: always() && (env.OPERATION == 'watch' || env.OPERATION == 'daily' || env.OPERATION == 'monitor' || env.OPERATION == 'public_daily' || env.OPERATION == 'public_monitor' || env.OPERATION == 'refresh')
        id: evidence
        run: uv run --locked python -m sportsbet.ingestion.public_artifacts --output "$RUNNER_TEMP/public-evidence"
      - name: Install checksum-pinned secret scanner
        if: always() && steps.evidence.outcome == 'success'
        id: scanner
        uses: ./.github/actions/install-gitleaks
      - name: Scan public evidence
        if: always() && steps.evidence.outcome == 'success' && steps.scanner.outcome == 'success'
        id: evidence_scan
        run: gitleaks dir "$RUNNER_TEMP/public-evidence" --config .gitleaks.toml --redact=100 --no-banner
      - name: Retain public market evidence for replay
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: market-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/public-evidence/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned secret scanner
        uses: ./.github/actions/install-gitleaks
      - name: Scan tracked tree and every incoming commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/tracked-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tracked-source"
          gitleaks dir "$RUNNER_TEMP/tracked-source" --config .gitleaks.toml --redact=100 --no-banner
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            range="-1 $HEAD_SHA"
          fi
          gitleaks git . --log-opts="$range" --config .gitleaks.toml --redact=100 --no-banner
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sportsbet
      DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@localhost:5432/sportsbet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install uv==0.11.32
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest -q
      - run: uv tool run pip-audit==2.10.1 --path .venv/lib/python3.12/site-packages --skip-editable
      - run: uv run --locked alembic upgrade head --sql > /tmp/migrations.sql
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sportsbet
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sportsbet
      DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@localhost:5432/sportsbet
      SPORTSBET_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sportsbet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install uv==0.11.32
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest tests/test_migrations.py -q
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked pytest tests/test_schema.py tests/test_hosted_storage.py tests/test_worker_postgres.py tests/test_db_access.py -q
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify default-deny container context
        run: |
          mkdir -p .local/secrets
          printf 'context-boundary-test' > .env
          printf 'context-boundary-test' > .local/secrets/context.json
          printf 'context-boundary-test' > src/sportsbet/context-secret.json
          printf 'context-boundary-test' > src/sportsbet/context-secret.key
          printf 'context-boundary-test' > src/sportsbet/arbitrage/context-secret.json
          printf 'context-boundary-test' > certs/context-secret.pem
          docker build --file - --output "type=local,dest=$RUNNER_TEMP/worker-context" . <<'DOCKERFILE'
          FROM scratch
          COPY . /
          DOCKERFILE
          for path in .env .local .git frontend src/sportsbet/context-secret.json \
            src/sportsbet/context-secret.key src/sportsbet/arbitrage/context-secret.json certs/context-secret.pem; do
            if test -e "$RUNNER_TEMP/worker-context/$path"; then
              echo "::error::Forbidden build context path: $path"
              exit 1
            fi
          done
          test -f "$RUNNER_TEMP/worker-context/src/sportsbet/daily.py"
          test -f "$RUNNER_TEMP/worker-context/certs/supabase-prod-ca-2021.crt"
      - name: Build locked worker image
        run: docker build --file Dockerfile.worker --tag sportsbet-worker:test .
      - name: Exercise isolated worker and native solver
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --tmpfs /app/.local:rw,nosuid,nodev,uid=10001,gid=10001,size=128m \
            --volume "$PWD/tests/worker_image_smoke.py:/checks/smoke.py:ro" \
            sportsbet-worker:test python /checks/smoke.py
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [secrets, backend, frontend, postgres, worker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --global vercel@59.15.1
      - name: Verify deployment credentials and project access
        run: |
          node --input-type=module <<'JS'
          const { VERCEL_TOKEN: token, VERCEL_PROJECT_ID: project, VERCEL_ORG_ID: team } = process.env;
          if (!token || !project || !team) throw new Error('Vercel token or project variables are missing');
          const response = await fetch(`https://api.vercel.com/v9/projects/${encodeURIComponent(project)}?teamId=${encodeURIComponent(team)}`, {
            headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(15000)
          });
          if (!response.ok) throw new Error(`Vercel project access failed (HTTP ${response.status}); check token scope and expiry`);
          const settings = await response.json();
          if (settings.rootDirectory !== 'frontend') throw new Error('Vercel root directory must be frontend');
          console.log('Vercel project access verified');
          JS
      # CLI pull requires team lookup that project-scoped tokens cannot perform.
      # Direct deploy supports restricted tokens; Vercel builds after all CI gates pass.
      - run: vercel deploy --yes --prod --token="$VERCEL_TOKEN"
      - name: Verify deployed access controls and data readiness
        env:
          DATA_PIPELINE_ENABLED: ${{ vars.DATA_PIPELINE_ENABLED }}
        run: |
          node --input-type=module <<'JS'
          const base = 'https://agentic-ev-analytics-platform.vercel.app';
          async function check(path, expected, options = {}) {
            const response = await fetch(base + path, { ...options, signal: AbortSignal.timeout(20000), redirect: 'manual' });
            if (!expected.includes(response.status)) throw new Error(`${path}: unexpected HTTP ${response.status}`);
            return response;
          }
          const home = await check('/', [200]);
          if (home.headers.get('x-content-type-options') !== 'nosniff' || !home.headers.get('content-security-policy')) {
            throw new Error('Production security headers are missing');
          }
          await check('/api/scan', [403], { method: 'POST' });
          await check('/.env', [404]);
          await check('/signals_cache.json', [404]);
          const required = process.env.DATA_PIPELINE_ENABLED === 'true';
          for (const path of ['/api/signals', '/api/metrics', '/api/scans', '/api/markets?sport=nfl', '/api/markets?sport=nba',
            '/api/games?sport=nfl', '/api/games?sport=nba', '/api/gamelogs?sport=nfl', '/api/gamelogs?sport=nba']) {
            const response = await check(path, required ? [200] : [200, 503]);
            if (response.status === 503) console.log(`::warning::${path} unavailable; deployment is not live-data ready`);
          }
          JS

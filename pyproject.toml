[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sportsbet"
version = "0.1.0"
description = "Quant-Sports Agentic Analytics Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "psutil>=5.9",
    "python-dotenv>=1.0",
    "statsmodels>=0.14",
    "httpx>=0.27",
    "nba_api>=1.11",
    "tenacity>=8.3",
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-postgresql",
    "mypy",
    "pyright",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sportsbet"]

[tool.pytest.ini_options]
addopts = "--basetemp=.local/test-tmp"
cache_dir = ".local/pytest-cache"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "site-packages"]
markers = [
    "serial: tests that must not run concurrently (share DB state)",
]

[tool.mypy]
strict = true
python_version = "3.12"
